name: Buniyad CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Frontend Type Check
        run: npx tsc --noEmit

      - name: Frontend Build
        run: npm run build

      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

      - name: Backend Type Check
        run: |
          cd server
          npx tsc --noEmit

      - name: Backend Build
        run: |
          cd server
          npm run build
